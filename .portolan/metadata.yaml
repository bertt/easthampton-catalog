processing_notes: Extracted 2026-10-21 with portolan-cli 0.8.0 from the ArcGIS MapServer [https://eh-gis.ehamptonny.gov/arcgis/rest/services/MapServiceForOpenGov/MapServer](https://eh-gis.ehamptonny.gov/arcgis/rest/services/MapServiceForOpenGov/MapServer),
  one GeoParquet file per feature layer, in the service's native CRS (EPSG:2263). Group layers, which
  hold no data of their own, were skipped. Layer 81 (a duplicate of layer 56, EH Waterbodies) is not mirrored
  separately. The service states it exists for the Town's OpenGov application and contains draft data
  that may be incomplete.
