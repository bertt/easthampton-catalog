description: 'Mirror of the "EH Zoning Boundaries" layer (layer 82, in the service''s "EH Zoning" group)
  of the Town of East Hampton''s [MapServiceForOpenGov](https://eh-gis.ehamptonny.gov/arcgis/rest/services/MapServiceForOpenGov/MapServer)
  ArcGIS service. 458 polygon features, kept in the source CRS EPSG:2263. The service warns that it contains
  draft data that may be incomplete. The publisher describes it as: "This data shows the Zoning regions
  for the Town of East Hampton NY. This is a polygon dataset. It was created by combining the parcel boundaries
  within a region demarcated by the zoning lines. If parcels were split by the zoning line this boundary
  was adjusted accordingly. This layer is updated as the zoning is updated. This is not the official zoning
  for the Town. This is just one piece that makes up the Towns larger comprehensive zoning. The Towns
  legal zoning is represented on the official published maps, as it is directed in the Town Code." Credit
  given by the publisher on this layer: TOEH IT Dept GIS Division, Barnaby Friedman. See [AGENTS.md](AGENTS.md)
  for the schema, quirks and query recipes.'
processing_notes: Extracted 2026-10-21 with portolan-cli 0.8.0 from ArcGIS MapServer layer 82 ([EH Zoning
  Boundaries](https://eh-gis.ehamptonny.gov/arcgis/rest/services/MapServiceForOpenGov/MapServer/82)).
  See the root README for the full process.
