description: 'Mirror of the "Building Footprints" layer (layer 46) of the Town of East Hampton''s [MapServiceForOpenGov](https://eh-gis.ehamptonny.gov/arcgis/rest/services/MapServiceForOpenGov/MapServer)
  ArcGIS service. 40,404 polygon features, kept in the source CRS EPSG:2263. The service warns that it
  contains draft data that may be incomplete. The publisher describes it as: "The Building Outline Creation
  products provide a two dimensional digital representation of the shape of a structure. Using Pictometry
  imagery, a polygon shape corresponding to the visible edges of a structure’s roof is created for each
  qualifying structure.The collection of polygon shapes are georeferenced and delivered in geodatabase
  and shapefile format. The initial published data is accurate as to the fly of April 2018. Footprints
  are continually updated by the Town of East Hampton from that point forward, so as to reflect the most
  recent changes.When visible, the following types of structures measuring at least 150sq.feet (14sq.meters)
  and at least five pixels wide (based on 12”(30cm) or better GSD imagery) are included:Residential, commercial
  and industrial buildingsAttached decks or porches that have a roof or railing or that are visibly raisedIsolated
  garages, mobile homes, shedsGreenhousesGrain silos and oil storage tanksBuildings under construction
  that at least have wallsTrailer boxes with windows or doors (construction field offices)Other features
  with a roofThe Building Outlines produced correspond to the edges of the structure’s roof.The Building
  Outlines are positioned on to the imagery based on the roof location unless the base of the building
  isclearly visible in which case the outline is shifted to align to the visible base.Specifications are
  based on use of 12-inch(30cm) or better GSD Pictometry-acquired imageryPositional accuracy: offset from
  the imagery less than or equal to five pixelsGeometric accuracy: length of untraced edges less than
  or equal to five pixelsError rate: ratio of positionally or geometrically inaccurate buildings and missed
  buildings less than or equalto 0.5%Project Period May -June 2018Number of Parcels 25,605Base Image Acquisition
  Apr 2018Base Imagery Source Acquired by PictometryNumber of Buildings 29,313" See [AGENTS.md](AGENTS.md)
  for the schema, quirks and query recipes.'
processing_notes: Extracted 2026-10-21 with portolan-cli 0.8.0 from ArcGIS MapServer layer 46 ([Building
