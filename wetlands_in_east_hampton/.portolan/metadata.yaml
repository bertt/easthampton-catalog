description: 'Mirror of the "Wetlands In East Hampton" layer (layer 48, in the service''s "Town Wetlands"
  group) of the Town of East Hampton''s [MapServiceForOpenGov](https://eh-gis.ehamptonny.gov/arcgis/rest/services/MapServiceForOpenGov/MapServer)
  ArcGIS service. 3,041 polygon features, kept in the source CRS EPSG:2263. The service warns that it
  contains draft data that may be incomplete. The publisher describes it as: "This layer shows wetland
  boundaries that have been flagged and surveyed in theTown of East Hampton. The wetland boundaries were
  digitized from surveys which were georeferenced in the GIS. The flagged wetlands were verified by the
  Planning department when they were shown on the original surveys.The majority of historic surveys have
  been georeferenced and the subsequent wetland boundaries have been digitized and added to the layer.
  The data is continually updated as new surveys are submitted to the Town. The layer is limited to the
  records the Town Planning department has. There may be wetlands that are not mapped on this layer as
  the Town does not have survey records for them." Credit given by the publisher on this layer: TOEH IT
  Department GIS, TOEH Planning Department, Lisa D''Andrea. See [AGENTS.md](AGENTS.md) for the schema,
  quirks and query recipes.'
processing_notes: Extracted 2026-10-21 with portolan-cli 0.8.0 from ArcGIS MapServer layer 48 ([Wetlands
  In East Hampton](https://eh-gis.ehamptonny.gov/arcgis/rest/services/MapServiceForOpenGov/MapServer/48)).
  See the root README for the full process.
